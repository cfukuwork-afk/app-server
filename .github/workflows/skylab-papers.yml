name: skylab-papers
on:
  workflow_dispatch:
  push:
    paths: ['skylab-papers/**', '.github/workflows/skylab-papers.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pypdf
      - run: cd skylab-papers && mkdir -p out && python discover_cites.py
      - name: encrypt and commit (only the research machine can read it)
        run: |
          cd skylab-papers && gzip -9 -c out/papers_digest.json > out/d.gz
          openssl rand -out out/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out/d.gz -out digest.enc -pass file:out/k.bin
          openssl pkeyutl -encrypt -pubin -inkey digest_pub.pem -in out/k.bin -out digest.key.enc
          rm -f out/k.bin
          git config user.name skylab-bot && git config user.email skylab-bot@users.noreply.github.com
          git add digest.enc digest.key.enc && git commit -m "SkyLab paper digest (encrypted)" && git pull --rebase && git push
