name: skylab-train
on:
  schedule:
    - cron: '17 3 * * *'   # 毎日 03:17 UTC（データ更新ぶんを学習・検証）
  workflow_dispatch:
  push:
    paths: ['.github/skylab-train-request']
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install scikit-learn numpy
      - uses: actions/cache@v4
        with:
          path: skylab-train/out/cache
          key: skylab-cache-v1-${{ github.run_id }}
          restore-keys: skylab-cache-v1-
      - run: cd skylab-train && OUT=out python backfill_train.py
      - name: save results
        run: |
          mkdir -p skylab-train/results/history && cp skylab-train/out/skill.json skylab-train/out/log.txt skylab-train/out/cloud_calibration.json skylab-train/results/ && cp skylab-train/out/skill.json skylab-train/results/history/$(date -u +%F).json
          git config user.name skylab-bot && git config user.email skylab-bot@users.noreply.github.com
          git add skylab-train/results && git commit -m "SkyLab training results" && git pull --rebase && git push
