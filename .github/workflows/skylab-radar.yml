name: skylab-radar
on:
  workflow_dispatch:
  push:
    paths: ['.github/skylab-radar-request']
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install boto3
      - run: cd skylab-radar && python ${SCRIPT:-discover.py}
      - name: save
        run: |
          mkdir -p skylab-radar/results && cp skylab-radar/out/*.txt skylab-radar/out/*.json skylab-radar/results/ 2>/dev/null || true
          git config user.name skylab-bot && git config user.email skylab-bot@users.noreply.github.com
          git add skylab-radar/results && git commit -m "SkyLab radar job results" && git pull --rebase && git push
